[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-voice-ai-agent"
version = "0.1.0"
description = "A modular real-time speech, RAG and LLM customer-support prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "torch>=2.2,<3",
  "silero-vad>=5.1,<7",
  "faster-whisper>=1.1,<2",
  "tokenizers>=0.22.2,<0.23",
  "sentence-transformers>=3.0,<6",
  "faiss-cpu>=1.8,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
  "sounddevice>=0.5,<1",
  "websockets>=13,<16",
]
realtime = [
  "aiortc>=1.9,<2",
]
integrations = [
  "cryptography>=42,<47",
]
all = [
  "aiortc>=1.9,<2",
  "cryptography>=42,<47",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
