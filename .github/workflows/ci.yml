name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install project and lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m ruff check app scripts tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Deterministic evaluation smoke test
        run: |
          python -m scripts.evaluate_voice_agent
          python -m scripts.evaluate_voice_agent --dataset evals/robustness_cases.jsonl
